<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Hotel Booking System</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="stylesheet" href="style.css">
		<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
		<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
	</head>
	<body>
		<div id="app">
			<!-- LOGIN OVERLAY -->
			<transition name="fade">
				<div class="login-overlay" v-if="!loggedIn">
					<div class="login-card">
						<div class="login-logo">Hotel Booking System</div>
						<div class="login-group">
							<div>
								<div class="login-label">USERNAME</div>
								<input class="login-input" v-model="loginForm.username" type="text" placeholder="username" autocomplete="username" />
							</div>
							<div>
								<div class="login-label">PASSWORD</div>
								<input class="login-input" v-model="loginForm.password" type="password" placeholder="********" autocomplete="current-password" />
							</div>
							<button class="btn-login" :disabled="loginLoading" @click="loginUser">
								{{ loginLoading ? 'Connecting…' : 'Login' }}
							</button>
							<div class="login-error" v-if="loginError">{{ loginError }}</div>
						</div>
					</div>
				</div>
			</transition>

			<!-- TOPBAR -->
			<div id="topbar">
				<div class="topbar-logo">Hotel Booking System</div>
				<div class="topbar-sep"></div>
				<div class="topbar-right" v-if="loggedIn">
					<div class="status-dot"></div>
					<span class="status-label">Logged in as </span>
					<span class="user-badge">
						<strong>{{ currentUser }}</strong>
					</span>
					<button class="btn-logout" @click="logoutUser">Logout</button>
				</div>
			</div>

			<!-- MAIN LAYOUT -->
			<div id="layout">
				<!-- SIDEBAR -->
				<div id="sidebar">
					<div class="sidebar-section-label">Categories</div>
					<div class="sidebar-scroll">
						<div
							v-for="cat in visibleCategories"
							:key="cat.id"
							class="cat-item"
							:class="{ active: currentCat?.id === cat.id }"
							:style="{ borderLeftColor: currentCat?.id === cat.id ? cat.color : 'transparent' }"
							@click="selectCat(cat)"
						>
							<div class="cat-icon" :style="{ color: cat.color }">{{ cat.icon }}</div>
							<div class="cat-label">{{ cat.title }}</div>
						</div>
					</div>
				</div>

				<!-- CMD PANEL -->
				<div id="cmd-panel">
					<div class="cmd-panel-header" v-if="currentCat">
						<!-- Back button + depth indicator (visible only when inside subSql) -->
						<div class="cmd-nav" v-if="navStack.length > 0">
							<button class="btn-back" @click="goBack">
								<svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor">
									<path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
								</svg>
								Back
							</button>
						</div>
						<div class="cmd-panel-title" :style="{ color: currentCat.color }">{{ currentCat.title }}</div>
						<div class="cmd-panel-desc">{{ currentCat.description }}</div>
					</div>
					<div class="cmd-panel-header" v-else>
						<div class="cmd-panel-title" style="color: var(--text-dim)">Select a category</div>
					</div>
					<div class="cmd-scroll">
						<div
							v-for="cmd in currentCat?.commands ?? []"
							:key="cmd.id"
							class="cmd-item"
							:class="{ active: currentCmd?.id === cmd.id }"
							:style="{ borderLeftColor: currentCmd?.id === cmd.id ? currentCat.color : 'transparent' }"
							@click="selectCmd(cmd)"
						>
							<div class="cmd-item-title">{{ cmd.title }}</div>
							<div class="cmd-item-desc">{{ cmd.description }}</div>
						</div>
					</div>
				</div>

				<!-- MAIN / DETAIL -->
				<div id="main">
					<!-- Empty state -->
					<div class="empty-state" v-if="!currentCmd">
						<div class="empty-icon">⊞</div>
						<div class="empty-label">Select a command to get started</div>
					</div>

					<!-- Detail -->
					<template v-else>
						<div class="detail-wrap">
							<div class="detail-header">
								<div class="detail-title">{{ currentCmd.title }}</div>
								<div class="detail-desc">{{ currentCmd.description }}</div>
								<div class="detail-badges">
									<span
										class="detail-badge"
										:style="{ color: currentCat.color, borderColor: currentCat.color + '30', background: currentCat.color + '10' }"
									>
										{{ currentCat.title }}
									</span>
								</div>
							</div>

							<div class="detail-grid">
								<!-- SQL TEMPLATE -->
								<div class="detail-card detail-card-full" v-if="currentCmd.type === 'table' || currentCmd.type === 'void'">
									<div class="card-header">
										<span class="card-title">SQL Template</span>
									</div>
									<div class="card-body">
										<pre class="sql-code" v-html="highlightSql(currentCmd.sql)"></pre>
										<div class="card-vertical-gap"></div>
										<button class="btn-run" :disabled="runLoading" @click="executeCommand(currentCmd.sql)">
											<svg v-if="!runLoading" width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
												<path d="M3 2l10 6-10 6V2z" />
											</svg>
											<svg v-else width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
												<circle cx="12" cy="12" r="10" />
												<path d="M12 6v6l4 2" />
											</svg>
											{{ runLoading ? 'Running…' : 'Run Query' }}
										</button>
									</div>
								</div>

								<!-- PARAMETERS -->
								<div v-if="currentCmd.params.length > 0" class="detail-card detail-card-full">
									<div class="card-header">
										<span class="card-title">Input Parameters</span>
									</div>
									<div class="card-body">
										<div class="param-form">
											<div class="param-row" v-for="p in currentCmd.params" :key="p.name">
												<label class="param-label">
													{{ p.label }}
													<span class="req" v-if="p.required">*</span>
												</label>
												<select v-if="p.type === 'select'" class="param-select" v-model="selectValues[p.name]">
													<option v-for="o in paramValues[p.name]" :value="Object.values(o)[0]">{{ Object.values(o)[1] }}</option>
												</select>
												<input v-else class="param-input" :type="p.type" :placeholder="p.placeholder" v-model="paramValues[p.name]" :readonly="p.readonly" />
											</div>
										</div>
									</div>
								</div>

								<!-- RESULTS -->
								<div class="detail-card detail-card-full" v-if="queryResult !== null && currentCmd.type === 'table'">
									<div class="card-header">
										<span class="card-title">Query Result</span>
									</div>
									<div class="card-body">
										<!-- Error -->
										<div class="error-box" v-if="queryResult.error">
											<strong>SQL Error:</strong><br>
											{{ queryResult.error }}
											<span v-if="queryResult.code"> (code {{ queryResult.code }})</span>
										</div>
										<!-- Rows returned -->
										<template v-else-if="queryResult.recordset?.length">
											<div class="result-table-wrap">
												<table class="result-table">
													<thead>
														<tr>
															<th v-for="col in queryResult.columns" :key="col">{{ col }}</th>
														</tr>
													</thead>
													<tbody>
														<tr
															v-for="(row, i) in queryResult.recordset"
															:key="i"
															@click="selectSubCmd(currentCmd.subSql, row)"
														>
															<td v-for="col in queryResult.columns" :key="col">
																<span class="null-val" v-if="row[col] === null || row[col] === undefined">NULL</span>
																<span v-else>{{ row[col] }}</span>
															</td>
														</tr>
													</tbody>
												</table>
											</div>
										</template>
										<!-- Rows affected -->
										<div class="rows-affected" v-else-if="queryResult.rowsAffected?.[0] > 0">
											✓ {{ queryResult.rowsAffected[0] }} row{{ queryResult.rowsAffected[0] !== 1 ? 's' : '' }} affected
										</div>
										<div class="rows-affected" v-else>
											✓ Query executed successfully. No rows returned.
										</div>
									</div>
								</div>

								<!-- KPI RESULTS -->
								<div class="detail-card detail-card-full" v-if="currentCmd.type === 'scalar'">
    								<div class="card-header">
        								<span class="card-title">KPI Overview</span>
        								<span style="font-size:10px;color:var(--text-dim)">
            							<span v-if="kpiLoading">Loading…</span>
        								</span>
    								</div>
									<div class="card-body">
        								<button class="btn-run" :disabled="kpiLoading" @click="executeKpiQueries(currentCmd.sql)" style="margin-bottom:16px">
            								<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2l10 6-10 6V2z"/></svg>
            								{{ kpiLoading ? 'Running…' : 'Run All' }}
        								</button>
        								<div class="kpi-grid">
        									<div v-for="[title, value] in Object.entries(kpiResults)" :key="title" class="kpi-section">
            									<div class="kpi-label">{{ title }}</div>
                    							<div class="kpi-value">{{ value }}</div>
                							</div>
            							</div>
        							</div>
    							</div>
								
								<!-- INSERT -->
								<div class="detail-card detail-card-full" v-if="currentCmd.insert">
									<div class="card-header">
										<span class="card-title">Insert new record</span>
									</div>
									<div class="card-body">
										<pre class="sql-code" v-html="highlightSql(currentCmd.insert.sql)"></pre>
										<div class="card-vertical-gap"></div>
										<div class="param-form">
											<div class="param-row" v-for="p in currentCmd.insert.params" :key="p.name">
												<label class="param-label">
													{{ p.label }}
													<span class="req" v-if="p.required">*</span>
												</label>
												<select v-if="p.type === 'select'" class="param-select" v-model="selectValues[p.name]">
													<option v-for="o in paramValues[p.name]" :value="Object.values(o)[0]">{{ Object.values(o)[1] }}</option>
												</select>
												<input v-else class="param-input" :type="p.type" :placeholder="p.placeholder" v-model="paramValues[p.name]" :readonly="p.readonly" />
											</div>
										</div>
										<div class="card-vertical-gap"></div>
										<button class="btn-run" :disabled="runLoading" @click="executeCommand(currentCmd.insert.sql)">
											<svg v-if="!runLoading" width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
												<path d="M3 2l10 6-10 6V2z" />
											</svg>
											<svg v-else width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
												<circle cx="12" cy="12" r="10" />
												<path d="M12 6v6l4 2" />
											</svg>
											{{ runLoading ? 'Running…' : 'Run Query' }}
										</button>
									</div>
								</div>
							</div>
							<!-- /detail-grid -->
						</div>
					</template>
				</div>
				<!-- /main -->
			</div>
			<!-- /layout -->
		</div>
		<!-- /app -->
		<script src="script.js"></script>
	</body>
</html>
